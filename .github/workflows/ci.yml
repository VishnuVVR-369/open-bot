name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Every apps/... or packages/... path named in a Markdown or MDX file must exist.
      - run: pnpm check:doc-paths
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:scripts
      # The generated noVNC viewer in apps/mobile must match its source and @novnc/novnc.
      - run: pnpm --filter @open-bot/mobile check:viewer

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # The same image as docker-compose.yml and scripts/test/pg.sh.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # Each suite creates and drops its own database on this server.
      TEST_DATABASE_URL: postgres://postgres:test-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration
      # The showcase seed renders its screenshots with Chromium, then must insert every row.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @open-bot/showcase seed
        env:
          SHOWCASE_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

  egress-core:
    name: Phone egress core (Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile/modules/egress/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Also checks that the Gradle wrapper jar is an official one.
      - uses: gradle/actions/setup-gradle@v4
      # Runs against the vectors in packages/egress/test-vectors, which the check job keeps current.
      - run: ./gradlew test

  android:
    name: Android app (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # No Firebase: the debug wake receiver instead of the messaging service.
          - variant: development
            env: APP_VARIANT=development
            checks: --development
          # Firebase with a placeholder config: the messaging service and receiver swap.
          - variant: normal
            env: GOOGLE_SERVICES_JSON=$GITHUB_WORKSPACE/apps/mobile/scripts/ci-google-services.json
            checks: --firebase
            # Release lint vets the manifest the signed app ships; debug builds skip it.
            tasks: :app:lintVitalRelease
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - run: env ${{ matrix.env }} npx expo prebuild --platform android --no-install
      - run: env ${{ matrix.env }} ./gradlew :app:assembleDebug ${{ matrix.tasks }} -PreactNativeArchitectures=x86_64
        working-directory: apps/mobile/android
      - run: node scripts/check-egress-manifest.mjs android/app/build/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml ${{ matrix.checks }}
