appId: dev.openbot.mobile.dev
name: Add, edit, start and delete a task on the board
# Run against a signed-in development app, with a teammate's name to give the task to:
#   maestro test -e TEAMMATE=<teammate name> maestro/tasks.yaml
# Starting the task queues a run in that teammate's main chat; with the computer offline it waits.
# A row is read as one control (title, status, owner, due day), so rows are matched by the start of
# their label; a moved task goes to the end of its column, so the flow scrolls to it; and the board
# slides back in after a save, so taps on it wait for that to end.
# Edits type into empty fields only: where a tap puts the cursor in a filled one varies by device.
---
- runFlow:
    file: flows/open-link.yaml
    env:
      LINK: openbot://tasks
- extendedWaitUntil:
    visible:
      id: new-task
    timeout: 20000

# Add a task for the teammate, due tomorrow.
- tapOn:
    id: new-task
- extendedWaitUntil:
    visible:
      id: task-title-input
    timeout: 5000
- tapOn:
    id: task-title-input
- inputText: Book the Lisbon hotel (Maestro)
- hideKeyboard
- tapOn:
    id: task-owner
- extendedWaitUntil:
    visible:
      id: owner-sheet
    timeout: 5000
- tapOn: ${TEAMMATE}
- tapOn:
    id: task-due-row
- extendedWaitUntil:
    visible:
      id: due-sheet
    timeout: 5000
- tapOn: Tomorrow
- assertVisible: Tomorrow
- tapOn:
    id: task-save
- extendedWaitUntil:
    visible: "Book the Lisbon hotel \\(Maestro\\).*"
    timeout: 10000

# Edit it: notes, and it's in progress.
- waitForAnimationToEnd
- tapOn: "Book the Lisbon hotel \\(Maestro\\).*"
- extendedWaitUntil:
    visible:
      id: task-notes-input
    timeout: 5000
- tapOn:
    id: task-notes-input
- inputText: Near the venue, under 180 euros a night.
- hideKeyboard
- tapOn:
    id: task-status-doing
- tapOn:
    id: task-save
- scrollUntilVisible:
    element: "Book the Lisbon hotel \\(Maestro\\), Doing.*"
    timeout: 10000

# Hand it to the teammate: their chat opens.
- waitForAnimationToEnd
- tapOn: "Book the Lisbon hotel \\(Maestro\\).*"
- extendedWaitUntil:
    visible:
      id: task-start
    timeout: 5000
- assertVisible: Near the venue, under 180 euros a night.
# Moved to Doing by hand, not asked yet.
- assertVisible: Ask ${TEAMMATE} to start
- tapOn:
    id: task-start
- extendedWaitUntil:
    visible:
      id: composer-input
    timeout: 15000
- back
- scrollUntilVisible:
    element: "Book the Lisbon hotel \\(Maestro\\).*"
    timeout: 10000

# Delete it, after confirming.
- waitForAnimationToEnd
- tapOn: "Book the Lisbon hotel \\(Maestro\\).*"
- extendedWaitUntil:
    visible:
      id: task-delete
    timeout: 5000
- scrollUntilVisible:
    element:
      id: task-delete
- tapOn:
    id: task-delete
- extendedWaitUntil:
    visible: Delete this task\?
    timeout: 5000
- tapOn: Delete
- extendedWaitUntil:
    notVisible: "Book the Lisbon hotel \\(Maestro\\).*"
    timeout: 10000
