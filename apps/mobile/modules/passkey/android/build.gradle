plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.openbot'
version = '0.1.0'

android {
  namespace "dev.openbot.passkey"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  implementation "androidx.credentials:credentials:1.6.0"
  // Passkeys from Google Password Manager on Android 13 and older.
  implementation "androidx.credentials:credentials-play-services-auth:1.6.0"
}
