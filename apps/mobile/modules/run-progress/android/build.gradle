plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'dev.openbot'
version = '0.1.0'
android {
  namespace "dev.openbot.runprogress"
  // Robolectric draws the notifications in RunProgressTest with the module's own manifest.
  testOptions { unitTests { includeAndroidResources = true } }
}
dependencies {
  // JVM tests: `./gradlew :run-progress:testDebugUnitTest`. RunProgressLogicTest checks the rules
  // in RunProgressLogic.kt; RunProgressTest draws and removes notifications under Robolectric.
  testImplementation "junit:junit:4.13.2"
  testImplementation "org.robolectric:robolectric:4.18.1"
  testImplementation "androidx.test:core:1.7.0"
}
