plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'dev.openbot'
version = '0.1.0'
android {
  namespace "dev.openbot.securescreen"
  testOptions { unitTests { includeAndroidResources = true } }
  // Expo's plugin turns abortOnError off. A call too new for minSdk 29 (NewApi) or any other
  // warning fails the build: `./gradlew :secure-screen:lintRelease`, which CI runs.
  lint {
    abortOnError = true
    warningsAsErrors = true
  }
}
dependencies {
  // JVM tests under Robolectric: `./gradlew :secure-screen:testDebugUnitTest`.
  testImplementation "junit:junit:4.13.2"
  testImplementation "org.robolectric:robolectric:4.18.1"
  testImplementation "androidx.test:core:1.7.0"
}
