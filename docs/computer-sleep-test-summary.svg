<text x="520" y="347" font-size="12" fill="#596675">Includes reclaimable file cache; memory limits unchanged.</text>
<text x="32" y="395" font-size="12" fill="#596675">Application quiesce/wake cycles are distinct from provider sleep. Railway sleep is checked separately.</text>
