<text x="32" y="60" font-size="13" fill="#596675">20 completed cycles · files, cookies, local storage, conversation and scheduling checked</text>
<text x="40" y="100" font-size="15" font-weight="600">Browser-ready time per cycle</text>
<text x="520" y="100" font-size="15" font-weight="600">Container memory.current</text>
