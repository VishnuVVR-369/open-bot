<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
<title id="title">Local computer sleep verification</title>
<desc id="desc">Twenty application wake cycles and measured local container memory across browser workloads. These are local measurements, not Railway billing estimates.</desc>
